<meta charset="UTF-8">

<title>Lakai Sushi | Cardápio Digital</title>

<style>
:root {
  --vermelho: #ed171f;
  --preto: #080808;
  --card: #171717;
  --branco: #fff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--preto);
  color: var(--branco);
  font-family: Arial, sans-serif;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.logo-titulo {
  text-align: center;
  margin: 20px 0;
  letter-spacing: 5px;
}

.logo-titulo h1 {
  font-size: 30px;
}

.logo-titulo p {
  color: var(--vermelho);
  letter-spacing: 4px;
  margin-top: 8px;
}

/* CATEGORIAS */

.categorias {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 15px 0;
}

.categorias a {
  color: white;
  text-decoration: none;
  white-space: nowrap;
  border: 1px solid var(--vermelho);
  padding: 12px 18px;
  border-radius: 25px;
  transition: .2s;
}

.categorias a:hover {
  background: var(--vermelho);
}

/* PRODUTOS */

.secao {
  margin: 35px 0;
  scroll-margin-top: 15px;
}

.secao h2 {
  font-size: 25px;
  margin-bottom: 18px;
  border-left: 5px solid var(--vermelho);
  padding-left: 12px;
}

.produtos {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
}

.produto {
  background: var(--card);
  border: 1px solid #333;
  border-radius: 14px;
  overflow: hidden;
  transition: .2s;
}

.produto:hover {
  transform: translateY(-4px);
  border-color: var(--vermelho);
}

.produto img {
  width: 100%;
  height: 165px;
  object-fit: cover;
}

.produto-info {
  padding: 14px;
}

.produto h3 {
  font-size: 17px;
  margin-bottom: 9px;
}

.descricao {
  color: #ccc;
  font-size: 13px;
  line-height: 1.5;
  min-height: 55px;
}

.preco {
  color: var(--vermelho);
  font-size: 22px;
  font-weight: bold;
  margin: 14px 0;
}

.botao-comprar {
  background: var(--vermelho);
  color: white;
  border: none;
  padding: 12px;
  width: 100%;
  border-radius: 9px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.botao-comprar:hover {
  background: #bd1017;
}

/* CARRINHO */

.carrinho {
  position: sticky;
  bottom: 0;
  background: #171717;
  border: 1px solid #444;
  border-radius: 15px;
  padding: 17px;
  margin: 25px 0;
  box-shadow: 0 0 20px #000;
  z-index: 10;
}

.carrinho-topo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.total {
  color: var(--vermelho);
  font-size: 23px;
  font-weight: bold;
  margin-top: 5px;
}

.lista-carrinho {
  margin-top: 15px;
  max-height: 180px;
  overflow-y: auto;
}

.item-carrinho {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid #333;
  font-size: 13px;
}

.quantidade {
  display: flex;
  align-items: center;
  gap: 8px;
}

.quantidade button {
  background: #333;
  color: white;
  border: none;
  border-radius: 5px;
  padding: 5px 10px;
  cursor: pointer;
}

.whatsapp {
  background: #0b9d45;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 15px 20px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.whatsapp:hover {
  background: #087c36;
}

.rodape {
  text-align: center;
  color: #aaa;
  padding: 25px 10px;
  font-size: 13px;
}

/* CELULAR */

@media (max-width: 600px) {
  .capa {
    height: 300px;
  }

  .container {
    padding: 12px;
  }

  .produtos {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .produto img {
    height: 115px;
  }

  .produto-info {
    padding: 10px;
  }

  .produto h3 {
    font-size: 14px;
  }

  .descricao {
    font-size: 12px;
    min-height: 75px;
  }

  .preco {
    font-size: 18px;
  }

  .botao-comprar {
    font-size: 13px;
  }

  .whatsapp {
    width: 100%;
  }
}
</style>
</head>

/* CARRINHO */

let carrinho = {};

/* MOEDA */

function moeda(valor) {
  return valor.toLocaleString("pt-BR", {
    style:"currency",
    currency:"BRL"
  });
}

/* GERAR CARDÁPIO */

function carregarCardapio() {

  const categorias = [...new Set(
    produtos.map(p => p.categoria)
  )];

  const nav = document.getElementById("categorias");
  const cardapio = document.getElementById("cardapio");

  nav.innerHTML = categorias.map((categoria, i) => `
    <a href="#categoria-${i}">
      ${categoria}
    </a>
  `).join("");

  cardapio.innerHTML = categorias.map((categoria, i) => {

    const itens = produtos.map((produto, index) => {

      if (produto.categoria !== categoria) return "";

      return `
        <article class="produto">

          <img
            src="${produto.img}"
            alt="${produto.nome}"
            loading="lazy"
          >

          <div class="produto-info">

            <h3>${produto.nome}</h3>

            <p class="descricao">
              ${produto.descricao}
            </p>

            <div class="preco">
              ${moeda(produto.preco)}
            </div>

            <button
              class="botao-comprar"
              onclick="adicionar(${index})"
            >
              🛒 Adicionar
            </button>

          </div>
        </article>
      `;

    }).join("");

    return `
      <section class="secao" id="categoria-${i}">
        <h2>${categoria}</h2>
        <div class="produtos">
          ${itens}
        </div>
      </section>
    `;

  }).join("");

}

/* ADICIONAR PRODUTO */

function adicionar(index) {

  carrinho[index] = (carrinho[index] || 0) + 1;

  atualizarCarrinho();

}

/* ALTERAR QUANTIDADE */

function alterarQuantidade(index, valor) {

  carrinho[index] += valor;

  if (carrinho[index] <= 0) {
    delete carrinho[index];
  }

  atualizarCarrinho();

}

/* ATUALIZAR CARRINHO */

function atualizarCarrinho() {

  const lista = document.getElementById("listaCarrinho");

  let total = 0;
  let quantidadeTotal = 0;
  let html = "";

  for (const index in carrinho) {

    const produto = produtos[index];
    const quantidade = carrinho[index];

    const subtotal = produto.preco * quantidade;

    total += subtotal;
    quantidadeTotal += quantidade;

    html += `
      <div class="item-carrinho">

        <div>
          ${produto.nome}<br>
          <strong>${moeda(subtotal)}</strong>
        </div>

        <div class="quantidade">

          <button onclick="alterarQuantidade(${index}, -1)">
            −
          </button>

          ${quantidade}

          <button onclick="alterarQuantidade(${index}, 1)">
            +
          </button>

        </div>

      </div>
    `;

  }

  lista.innerHTML = html || "Seu carrinho está vazio.";

  document.getElementById("total").innerText = moeda(total);

  document.getElementById("contador").innerText =
    quantidadeTotal + " produto(s)";

}

/* FINALIZAR NO WHATSAPP */

function finalizarPedido() {

  const indices = Object.keys(carrinho);

  if (indices.length === 0) {
    alert("Adicione produtos ao carrinho primeiro!");
    return;
  }

  let mensagem =
    "Olá, Lakai Sushi! Gostaria de fazer meu pedido:\n\n";

  let total = 0;

  indices.forEach(index => {

    const produto = produtos[index];
    const quantidade = carrinho[index];

    const subtotal = produto.preco * quantidade;

    total += subtotal;

    mensagem +=
      `${quantidade}x ${produto.nome} - ${moeda(subtotal)}\n`;

  });

  mensagem +=
    `\nTOTAL: ${moeda(total)}` +
    "\n\nAguardo confirmação do pedido!";

  const link =
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    encodeURIComponent(mensagem);

  window.open(link, "_blank");

}

/* INICIAR */

carregarCardapio();
atualizarCarrinho();
